name: Desktop Tauri Build V2

# 手动触发 + Joy 分支 push/PR 触发；paths 限定为 desktop-v2 项目，
# 避免改扩展或其他项目时误触发三平台构建
on:
  workflow_dispatch:
  push:
    branches:
      - Joy
    paths:
      - "desktop-v2/**"
      - ".github/workflows/Desktop Tauri Build v2.yml"
  pull_request:
    branches:
      - Joy
    paths:
      - "desktop-v2/**"
      - ".github/workflows/Desktop Tauri Build v2.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate icons
        working-directory: desktop-v2
        run: python scripts/generate_icons.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-v2/src-tauri -> target

      # 新桌面版直接复用扩展的 React 源码，需要先装好仓库根依赖，
      # 让 pages/components/utils 里的 react、lucide-react 等能被解析
      - name: Install root dependencies
        run: npm install --no-package-lock

      - name: Install frontend dependencies
        working-directory: desktop-v2
        run: npm install --no-package-lock

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-v2
          tauriScript: npm run tauri --

      - name: List build outputs
        if: always()
        shell: bash
        run: |
          echo "== target/release =="
          ls -la desktop-v2/src-tauri/target/release 2>/dev/null | head -40 || true
          echo "== bundle =="
          find desktop-v2/src-tauri/target/release/bundle -type f 2>/dev/null | head -50 || true

      - uses: actions/upload-artifact@v6
        with:
          name: bilibili-unlimited-history-${{ matrix.platform }}
          path: |
            desktop-v2/src-tauri/target/release/bundle/dmg/**
            desktop-v2/src-tauri/target/release/bundle/macos/**
            desktop-v2/src-tauri/target/release/bundle/deb/**
            desktop-v2/src-tauri/target/release/bundle/appimage/**
            desktop-v2/src-tauri/target/release/bundle/rpm/**
            desktop-v2/src-tauri/target/release/bundle/msi/**
            desktop-v2/src-tauri/target/release/bundle/nsis/**
            desktop-v2/src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14

      # 上传独立 Windows EXE；tag 与原桌面版区分，避免互相覆盖
      - name: Upload standalone Windows EXE
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bilibili-unlimited-history-build-${{ github.run_number }}
          name: Bilibili Unlimited History build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          make_latest: false
          files: desktop-v2/src-tauri/target/release/bilibili-unlimited-history.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
