name: Desktop Tauri Build

# 仅手动触发，避免频繁 push 自动构建
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - desktop-tauri
  #     - main
  #   paths:
  #     - "desktop/**"
  #     - ".github/workflows/desktop-tauri.yml"
  # pull_request:
  #   branches:
  #     - desktop-tauri
  #     - main
  #   paths:
  #     - "desktop/**"
  #     - ".github/workflows/desktop-tauri.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate icons
        working-directory: desktop
        run: python scripts/generate_icons.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri --

      - name: List build outputs
        if: always()
        shell: bash
        run: |
          echo "== target/release =="
          ls -la desktop/src-tauri/target/release 2>/dev/null | head -40 || true
          echo "== bundle =="
          find desktop/src-tauri/target/release/bundle -type f 2>/dev/null | head -50 || true

      - uses: actions/upload-artifact@v5
        with:
          name: bili-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/**
            desktop/src-tauri/target/release/bundle/macos/**
            desktop/src-tauri/target/release/bundle/deb/**
            desktop/src-tauri/target/release/bundle/appimage/**
            desktop/src-tauri/target/release/bundle/rpm/**
            desktop/src-tauri/target/release/bundle/msi/**
            desktop/src-tauri/target/release/bundle/nsis/**
            desktop/src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14
