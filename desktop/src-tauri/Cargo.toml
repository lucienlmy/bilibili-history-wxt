[package]
name = "bilibili-history-desktop"
version = "0.1.0"
description = "Offline viewer for Bilibili History extension backups"
authors = ["lucienlmy"]
edition = "2021"

[lib]
name = "bilibili_history_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
