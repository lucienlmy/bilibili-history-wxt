<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili History</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button type="button" class="brand" id="brand-home" title="返回历史记录">
            <span class="brand-logo"><span class="brand-logo-gloss"></span><span class="brand-letter">B</span></span>
            <span class="brand-expand-ico" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M12 4v16"/></svg>
            </span>
            <span class="brand-text">无限历史记录</span>
          </button>
          <button type="button" class="icon-btn" id="btn-collapse" title="收起侧边栏" aria-label="收起侧边栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7"/><path d="M18 19l-7-7 7-7"/></svg>
          </button>
        </div>
        <nav class="sidebar-nav" id="nav"></nav>
        <div class="sidebar-foot">
          <p class="file-meta" id="file-meta">尚未加载备份</p>
          <div class="foot-row">
            <span class="ver">v0.1.0</span>
            <button type="button" class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
        </div>
      </aside>
      <div class="main-wrap" id="main-wrap">
        <main class="page" id="page">
          <header class="toolbar sticky" id="toolbar">
            <div class="toolbar-inner">
              <div class="toolbar-top">
                <div class="toolbar-title">
                  <div class="title-row">
                    <h1 id="page-title">历史记录</h1>
                    <span class="count" id="page-count">0 个内容</span>
                  </div>
                  <p class="sub" id="page-desc">搜索、筛选并浏览本地备份中的观看记录</p>
                </div>
                <div class="toolbar-actions">
                  <button type="button" class="btn primary" id="btn-open-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>打开备份</span>
                  </button>
                  <button type="button" class="btn icon" id="btn-view-settings" title="历史视图设置" aria-label="历史视图设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                  </button>
                  <button type="button" class="btn icon" id="btn-refresh" title="刷新列表">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
                  </button>
                  <button type="button" class="btn icon" id="btn-toggle-filters" title="收起搜索与筛选" aria-expanded="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                  </button>
                </div>
              </div>
              <div class="filters" id="filters">
                <div class="search-wrap">
                  <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
                  <input id="search" type="search" placeholder="搜索标题 / UP 主 / BV 号…" />
                </div>
                <div class="select-wrap">
                  <select id="search-kind">
                    <option value="all">全部字段</option>
                    <option value="title">标题</option>
                    <option value="up">UP 主</option>
                    <option value="bvid">BV 号</option>
                  </select>
                </div>
                <div class="segment" id="display-mode" title="展示模式">
                  <button type="button" data-mode="content" class="active">按内容</button>
                  <button type="button" data-mode="visit">按观看</button>
                </div>
                <div class="select-wrap">
                  <select id="type-filter">
                    <option value="all">全部分类</option>
                    <option value="archive">视频</option>
                    <option value="live">直播</option>
                    <option value="pgc">番剧</option>
                    <option value="article">专栏</option>
                    <option value="cheese">课堂</option>
                  </select>
                </div>
                <div class="date-range">
                  <input id="date-start" type="date" title="开始日期" />
                  <span class="date-sep">至</span>
                  <input id="date-end" type="date" title="结束日期" />
                </div>
                <div class="select-wrap">
                  <select id="sort">
                    <option value="time-desc">时间倒序</option>
                    <option value="time-asc">时间正序</option>
                    <option value="title">标题</option>
                  </select>
                </div>
                <div class="select-wrap">
                  <select id="cols">
                    <option value="auto">自动列数</option>
                    <option value="3">3 列</option>
                    <option value="4" selected>4 列</option>
                    <option value="5">5 列</option>
                  </select>
                </div>
                <button type="button" class="clear-filters" id="btn-clear-filters" hidden>清除筛选</button>
              </div>
            </div>
          </header>
          <section id="content" class="content"></section>
          <nav id="pagination" class="pagination" hidden></nav>
        </main>
      </div>
    </div>
    <button type="button" class="scroll-top" id="scroll-top" title="返回顶部" hidden>↑</button>
    <div class="modal-mask" id="view-settings-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vs-title">
        <div class="modal-head">
          <h2 id="vs-title">历史视图设置</h2>
          <button type="button" class="icon-btn" id="vs-close" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body">
          <label class="field"><span>网格列数</span>
            <select id="vs-cols">
              <option value="auto">自动</option>
              <option value="3">3 列</option>
              <option value="4">4 列</option>
              <option value="5">5 列</option>
            </select>
          </label>
          <label class="field"><span>每页条数</span>
            <select id="vs-page-size">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
          <p class="hint">桌面只读版仅保留视图相关设置；同步与账号相关选项不可用。</p>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn" id="vs-cancel">取消</button>
          <button type="button" class="btn primary" id="vs-save">保存</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
