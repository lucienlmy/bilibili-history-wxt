<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili 无限历史记录</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button type="button" class="brand" id="brand-home" title="返回历史记录">
            <span class="brand-logo"><span class="brand-logo-gloss"></span><span>B</span></span>
            <span class="brand-text">无限历史记录</span>
          </button>
          <button type="button" class="icon-btn" id="btn-collapse" title="收起侧边栏" aria-label="收起侧边栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7"/><path d="M18 19l-7-7 7-7"/></svg>
          </button>
        </div>
        <nav class="sidebar-nav" id="nav"></nav>
        <div class="sidebar-foot">
          <button type="button" class="btn-open" id="btn-open">打开备份 JSON</button>
          <p class="file-meta" id="file-meta">尚未加载备份</p>
          <div class="foot-row">
            <span class="ver">桌面只读 v0.1.0</span>
            <button type="button" class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
        </div>
      </aside>
      <div class="main-wrap" id="main-wrap">
        <main class="page">
          <header class="toolbar sticky">
            <div class="toolbar-top">
              <div class="toolbar-title">
                <h1 id="page-title">历史记录</h1>
                <span class="count" id="page-count">0 个内容</span>
                <p class="sub" id="page-desc">搜索、筛选并浏览本地备份中的观看记录</p>
              </div>
              <div class="toolbar-actions">
                <button type="button" class="btn primary" id="btn-open-2">打开备份</button>
              </div>
            </div>
            <div class="filters" id="filters">
              <div class="search-wrap">
                <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="search" type="search" placeholder="搜索标题 / UP 主 / BV 号…" />
              </div>
              <select id="type-filter">
                <option value="all">全部分类</option>
                <option value="archive">视频</option>
                <option value="live">直播</option>
                <option value="pgc">番剧</option>
                <option value="article">专栏</option>
                <option value="cheese">课堂</option>
              </select>
              <select id="sort">
                <option value="time-desc">时间倒序</option>
                <option value="time-asc">时间正序</option>
                <option value="title">标题</option>
              </select>
              <select id="cols">
                <option value="auto">自动列数</option>
                <option value="3">3 列</option>
                <option value="4" selected>4 列</option>
                <option value="5">5 列</option>
              </select>
            </div>
          </header>
          <section id="content" class="content"></section>
        </main>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
